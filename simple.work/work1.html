<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body {
            margin: 0;
            font-family: Arial
        }

        .quti {
            display: flex;
            height: 700px;
        }

        .rasm {
            width: 40%;
        }

        .box {
            padding: 70px;
            width: 43%;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 28px
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 7px 0;
            border: 1px solid #999;
            border-radius: 30px;
            background-color: white;
            font-size: 17px;
        }

        .btn {
            background-color: #111;
            color: white;
        }
    </style>

</head>
<body>
    <div class="quti">
        <img class="rasm" src="balloon.jpg">

        <div class="box">
            <h1>Travel with us</h1>
            <p>Join us today</p>

            <button>🌈 Sign up with Google</button>
            <button> Sign up with Apple</button>
            <hr>
            <button class="btn">Sign up with phone or email</button>

            <small>By signing up, you agree to the Terms of Service and Privacy Policy.</small>

            <h3>Already have an account?</h3>
            <button>Login in</button>
        </div>
    </div>
</body> 
</html>
