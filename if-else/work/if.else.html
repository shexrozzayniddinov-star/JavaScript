<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if-else</title>
</head>

<body>
    <style>
        body{
            background-color: black;
            color: rgb(0, 255, 229);
        }
    </style>

    <script>

        let ball = +prompt('Balingizni kiriting');

        if (ball === 100) {
            console.log('Grand');
        } else if (ball >=70) {
            console.log('Otdingiz')
        } else {
            console.log('Yiqildingiz')
        }


    </script>
</body>

</html>
